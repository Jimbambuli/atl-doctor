# Cross file for the agent on an Android device (x86_64). The compilers live in
# $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin - put that directory on PATH, e.g.
#   PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH \
#   meson setup build-android agent --cross-file agent/cross/android-x86_64.ini
[binaries]
c = 'x86_64-linux-android29-clang'
ar = 'llvm-ar'
strip = 'llvm-strip'

[properties]
android_abi = 'x86_64'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
