# Cross file for the agent on an Android device (arm64-v8a). The compilers live in
# $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin - put that directory on PATH, e.g.
#   PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH \
#   meson setup build-android agent --cross-file agent/cross/android-arm64.ini
[binaries]
c = 'aarch64-linux-android29-clang'
ar = 'llvm-ar'
strip = 'llvm-strip'

[properties]
android_abi = 'arm64-v8a'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
