[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atl-doctor"
version = "0.1.0"
description = "Diagnose why an Android app does not run (correctly) under Android Translation Layer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Jimbambuli" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
atl-doctor = "atl_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["atl_doctor*"]

[tool.setuptools.package-data]
atl_doctor = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real ATL and an APK (ATL_DOCTOR_PREFIX, ATL_DOCTOR_TEST_APK)"]
